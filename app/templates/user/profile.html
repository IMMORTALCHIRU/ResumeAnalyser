{% extends 'base.html' %}
{% block title %}My Profile – Smart Resume Analyser{% endblock %}
{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="text-center mb-4">
                    <div class="user-avatar-xl mx-auto mb-3" style="background-color:{{ current_user.avatar_color }}; width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:2rem; color:#fff;">
                        {{ current_user.get_initials() }}
                    </div>
                    <h3 class="fw-bold mb-0">{{ current_user.get_display_name() }}</h3>
                    <small class="text-muted">{{ current_user.email }}</small>
                </div>
                <form method="POST" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label"><img src="https://img.icons8.com/fluency/18/user-male-circle.png" alt=""> Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ current_user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><img src="https://img.icons8.com/fluency/18/phone.png" alt=""> Phone</label>
                        <input type="tel" class="form-control" name="phone" value="{{ current_user.phone or '' }}" placeholder="Your phone number">
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><img src="https://img.icons8.com/fluency/18/job.png" alt=""> Preferred Roles (comma-separated)</label>
                        <input type="text" class="form-control" name="preferred_roles" value="{{ current_user.preferred_roles|join(', ') if current_user.preferred_roles else '' }}" placeholder="e.g. Data Scientist, ML Engineer">
                    </div>
                    <div class="mb-4">
                        <label class="form-label"><img src="https://img.icons8.com/fluency/18/user-male-circle.png" alt=""> Profile Summary</label>
                        <textarea class="form-control" name="profile_summary" rows="4" placeholder="Tell us about yourself...">{{ current_user.profile_summary or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <img src="https://img.icons8.com/fluency/20/save.png" alt=""> Save Changes
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('user_dashboard.dashboard') }}" class="text-muted small">
                        <i class="bi bi-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
