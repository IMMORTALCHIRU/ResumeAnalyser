{% extends 'base.html' %}
{% block title %}Login – Smart Resume Analyser{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card animate__animated animate__fadeInUp">
                    <div class="auth-header text-center mb-4">
                        <img src="https://img.icons8.com/fluency/64/resume.png" alt="Logo" class="auth-logo mb-3">
                        <h2 class="auth-title">Welcome Back!</h2>
                        <p class="auth-subtitle text-muted">Sign in to your candidate account</p>
                    </div>
                    <form method="POST" class="auth-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="form-group mb-3">
                            <label for="email" class="form-label">
                                <img src="https://img.icons8.com/fluency/18/email.png" alt=""> Email Address
                            </label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="password" class="form-label">
                                <img src="https://img.icons8.com/fluency/18/lock.png" alt=""> Password
                            </label>
                            <div class="password-input-wrapper position-relative">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                <button type="button" class="password-toggle btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent" onclick="togglePassword('password')">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label small" for="remember">Remember me</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">
                            <img src="https://img.icons8.com/fluency/20/login-rounded-right.png" alt=""> Sign In
                        </button>
                    </form>
                    <div class="auth-divider my-3 text-center text-muted"><small>or</small></div>
                    <div class="text-center">
                        <p class="mb-2">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Create one</a></p>
                        <p class="mb-0">
                            <a href="{{ url_for('auth.recruiter_login') }}" class="text-warning fw-semibold">
                                <img src="https://img.icons8.com/fluency/18/human-resources.png" alt=""> Login as Recruiter
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
